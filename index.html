<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grand Strategy: Global Crisis</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [gameState, setGameState] = useState('menu');
      const [nation, setNation] = useState(null);
      const [turn, setTurn] = useState(1);
      
      const [stats, setStats] = useState({
        gold: 100,
        army: 50,
        expansionPoints: 3,
      });

      // Expanded Map Grid (OpenFront style tiles)
      const [tiles, setTiles] = useState([
        { id: 0, name: "North-West Coast", owner: "Neutral", defense: 10, color: "bg-slate-800 border-slate-700 text-slate-300" },
        { id: 1, name: "Northern Plains", owner: "Neutral", defense: 15, color: "bg-slate-800 border-slate-700 text-slate-300" },
        { id: 2, name: "Capital Region", owner: "Player", defense: 30, color: "bg-blue-900 border-blue-500 text-blue-300" },
        { id: 3, name: "Eastern Hills", owner: "Neutral", defense: 20, color: "bg-slate-800 border-slate-700 text-slate-300" },
        { id: 4, name: "Western Desert", owner: "Neutral", defense: 15, color: "bg-slate-800 border-slate-700 text-slate-300" },
        { id: 5, name: "Central Valley", owner: "AI_Rival", defense: 25, color: "bg-red-950 border-red-600 text-red-300" },
        { id: 6, name: "Industrial Core", owner: "AI_Rival", defense: 35, color: "bg-red-950 border-red-600 text-red-300" },
        { id: 7, name: "Eastern Port", owner: "Neutral", defense: 20, color: "bg-slate-800 border-slate-700 text-slate-300" },
        { id: 8, name: "Southern Jungle", owner: "Neutral", defense: 10, color: "bg-slate-800 border-slate-700 text-slate-300" },
        { id: 9, name: "Southern Reach", owner: "Neutral", defense: 15, color: "bg-slate-800 border-slate-700 text-slate-300" },
      ]);

      const [logs, setLogs] = useState([]);

      const nationsData = {
        usa: { name: "United States Alliance", bonus: "+20 Starting Gold" },
        eur: { name: "European Coalition", bonus: "+10 Starting Army" },
        asi: { name: "Eurasian Pact", bonus: "+1 Expansion Point" }
      };

      const selectNation = (key) => {
        const nat = nationsData[key];
        setNation(nat);
        setLogs([`[Turn 1] Command established as ${nat.name}. Expand your territory to win!`]);
        setGameState('playing');
      };

      // Player Action: Attack or Expand into a tile
      const handleTileClick = (tile) => {
        if (tile.owner === 'Player') {
          setLogs(prev => [`[Info] You already control ${tile.name}.`, ...prev.slice(0, 6)]);
          return;
        }

        if (stats.army < tile.defense) {
          setLogs(prev => [`[Failed Attack] ${tile.name} has defense ${tile.defense}. You need a larger army!`, ...prev.slice(0, 6)]);
          return;
        }

        // Conquer Tile
        const updatedTiles = tiles.map(t => {
          if (t.id === tile.id) {
            return { ...t, owner: 'Player', color: "bg-blue-900 border-blue-500 text-blue-300" };
          }
          return t;
        });

        setTiles(updatedTiles);
        setStats(prev => ({
          ...prev,
          gold: prev.gold + 25,
          army: prev.army - 10,
        }));

        setLogs(prev => [`[Victory] Successfully captured ${tile.name}! Gained +25 Gold.`, ...prev.slice(0, 6)]);
      };

      // End Turn & AI Turn simulation
      const endTurn = () => {
        let newGold = stats.gold + 40; // Income per turn
        let newArmy = stats.army + 20; // Recruitment per turn

        // AI Logic: AI tries to expand into neutral territory
        let updatedTiles = [...tiles];
        const neutralTiles = updatedTiles.filter(t => t.owner === 'Neutral');
        
        let aiLog = "AI rival consolidated its borders.";
        if (neutralTiles.length > 0 && Math.random() < 0.7) {
          const targetNeutral = neutralTiles[Math.floor(Math.random() * neutralTiles.length)];
          updatedTiles = updatedTiles.map(t => {
            if (t.id === targetNeutral.id) {
              return { ...t, owner: 'AI_Rival', color: "bg-red-950 border-red-600 text-red-300" };
            }
            return t;
          });
          aiLog = `[AI Expansion] Rival faction conquered ${targetNeutral.name}!`;
        }

        setTiles(updatedTiles);
        setStats({
          gold: newGold,
          army: newArmy,
          expansionPoints: 3,
        });
        setTurn(prev => prev + 1);

        setLogs(prev => [
          `--- Turn ${turn + 1} Started ---`,
          aiLog,
          `Economic report: +40 Gold, +20 Army units added.`,
          ...prev.slice(0, 5)
        ]);
      };

      return (
        <div className="min-h-screen bg-slate-950 p-4 sm:p-6 flex flex-col items-center font-sans select-none">
          <header className="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-xl p-4 mb-6 shadow-xl flex justify-between items-center">
            <h1 className="text-lg sm:text-xl font-black text-amber-400 tracking-wider">
              <i className="fa-solid fa-earth-americas mr-2"></i> GLOBAL CRISIS: OPENFRONT EDITION
            </h1>
            {gameState === 'playing' && (
              <div className="text-sm bg-slate-950 px-3 py-1 rounded border border-slate-800">
                Turn: <span className="text-amber-400 font-bold">{turn}</span>
              </div>
            )}
          </header>

          <main className="w-full max-w-4xl">
            {gameState === 'menu' && (
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-8 text-center shadow-2xl">
                <h2 className="text-2xl font-bold mb-4">Choose Your Faction</h2>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-6">
                  {Object.keys(nationsData).map(key => (
                    <div key={key} className="bg-slate-950 border border-slate-800 p-5 rounded-xl flex flex-col justify-between hover:border-amber-500 transition">
                      <div>
                        <h3 className="font-bold text-amber-400 mb-2">{nationsData[key].name}</h3>
                        <p className="text-xs text-slate-400 mb-4">{nationsData[key].bonus}</p>
                      </div>
                      <button onClick={() => selectNation(key)} className="bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold py-2 rounded">
                        Deploy
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {gameState === 'playing' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {/* Left Panel: Stats & Controls */}
                <div className="space-y-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-xl space-y-3">
                    <h3 className="text-xs font-bold uppercase text-slate-400 tracking-wider">Resource Hub</h3>
                    <div className="flex justify-between bg-slate-950 p-2.5 rounded border border-slate-800 text-sm">
                      <span>Treasury Gold:</span>
                      <strong className="text-yellow-400">{stats.gold}</strong>
                    </div>
                    <div className="flex justify-between bg-slate-950 p-2.5 rounded border border-slate-800 text-sm">
                      <span>Army Strength:</span>
                      <strong className="text-green-400">{stats.army}</strong>
                    </div>
                    <button onClick={endTurn} className="w-full bg-blue-600 hover:bg-blue-500 font-bold text-xs py-3 rounded-lg transition mt-2 shadow">
                      End Turn & Process AI <i className="fa-solid fa-forward ml-1"></i>
                    </button>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-xl h-48 flex flex-col">
                    <h3 className="text-xs font-bold uppercase text-slate-400 tracking-wider mb-2">Live Situation Log</h3>
                    <div className="bg-slate-950 border border-slate-800 rounded p-2 flex-1 overflow-y-auto text-[11px] font-mono space-y-1">
                      {logs.map((log, idx) => (
                        <div key={idx} className="text-slate-300 border-b border-slate-900 pb-1">{log}</div>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Right Panel: Interactive World Map Grid */}
                <div className="md:col-span-2 bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-xl flex flex-col">
                  <h3 className="text-xs font-bold uppercase text-slate-400 tracking-wider mb-3">
                    <i className="fa-solid fa-map text-amber-400 mr-1"></i> Strategic World Map (Click to Attack)
                  </h3>
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 flex-1">
                    {tiles.map(tile => (
                      <button 
                        key={tile.id} 
                        onClick={() => handleTileClick(tile)}
                        className={`border p-3 rounded-xl flex flex-col justify-between text-left transition transform hover:scale-105 ${tile.color}`}
                      >
                        <div>
                          <div className="text-xs font-bold">{tile.name}</div>
                          <div className="text-[10px] opacity-75 mt-0.5">Owner: {tile.owner}</div>
                        </div>
                        <div className="text-[10px] mt-3 font-mono bg-black/30 px-2 py-0.5 rounded w-max">
                          Defense: {tile.defense}
                        </div>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
