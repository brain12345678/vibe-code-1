<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grand Strategy: Global Crisis</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    function App() {
      const { useState } = React;
      const [gameState, setGameState] = useState('menu');
      const [nation, setNation] = useState(null);
      const [month, setMonth] = useState(1);
      const [year, setYear] = useState(2026);
      
      const [stats, setStats] = useState({
        ip: 0,
        mp: 0,
        energy: 0,
        stability: 100,
        warSupport: 50,
      });

      const [territories, setTerritories] = useState([
        { id: 1, name: "North Zone", owner: "USA", color: "border-blue-500 bg-blue-950 text-blue-400" },
        { id: 2, name: "East Zone", owner: "PRC", color: "border-red-500 bg-red-950 text-red-400" },
        { id: 3, name: "Central Zone", owner: "EU", color: "border-emerald-500 bg-emerald-950 text-emerald-400" },
        { id: 4, name: "Southern Steppes", owner: "RU", color: "border-amber-500 bg-amber-950 text-amber-400" }
      ]);

      const [logs, setLogs] = useState([]);

      const nationsData = {
        usa: { name: "United States (USA)", alignment: "Western Democratic Coalition", ip: 120, mp: 1500, energy: 100, desc: "Massive industrial output, superior air/naval tech." },
        prc: { name: "People's Republic of China (PRC)", alignment: "Eastern Eurasian Pact", ip: 110, mp: 3500, energy: 70, desc: "Massive manpower reserves, manufacturing hub." },
        eu: { name: "European Federation (EU)", alignment: "EU Defense Force", ip: 95, mp: 1200, energy: 60, desc: "Advanced defensive tech, highly educated population." },
        ru: { name: "Russian Federation (RU)", alignment: "Eurasian Strategic Axis", ip: 75, mp: 1800, energy: 150, desc: "Vast natural resources, heavy armor." }
      };

      const selectNation = (key) => {
        const nat = nationsData[key];
        setNation(nat);
        setStats({
          ip: nat.ip,
          mp: nat.mp,
          energy: nat.energy,
          stability: 90,
          warSupport: 60,
        });
        setLogs([`[Month 1, 2026] You have assumed control of ${nat.name}. Global crisis begins.`]);
        setGameState('playing');
      };

      const advanceMonth = (actionType) => {
        let newIp = stats.ip;
        let newMp = stats.mp;
        let newEnergy = stats.energy;
        let newStab = stats.stability;
        let newWarSup = stats.warSupport;
        let logMsg = "";

        if (actionType === 'military') {
          newIp -= 15;
          newMp -= 50;
          newWarSup += 5;
          logMsg = "Expanded military divisions and mobilized reservists.";
        } else if (actionType === 'economy') {
          newIp += 10;
          newEnergy += 5;
          logMsg = "Invested heavily into industrial complexes. IP output increased.";
        } else if (actionType === 'diplomacy') {
          newStab += 5;
          newEnergy += 10;
          logMsg = "Secured emergency energy trade agreements.";
        } else {
          logMsg = "Maintained strategic posture and monitored flashpoints.";
        }

        let nextMonth = month + 1;
        let nextYear = year;
        if (nextMonth > 12) {
          nextMonth = 1;
          nextYear += 1;
        }

        const aiRivals = ["USA", "PRC", "EU", "RU"];
        const colorMap = {
          "USA": "border-blue-500 bg-blue-950 text-blue-400",
          "PRC": "border-red-500 bg-red-950 text-red-400",
          "EU": "border-emerald-500 bg-emerald-950 text-emerald-400",
          "RU": "border-amber-500 bg-amber-950 text-amber-400"
        };

        let updatedTerritories = [...territories];
        let aiEventMsg = "Rival power blocs monitored borders.";

        if (Math.random() < 0.3) {
          const randomZoneIndex = Math.floor(Math.random() * updatedTerritories.length);
          const randomRival = aiRivals[Math.floor(Math.random() * aiRivals.length)];
          const targetZone = updatedTerritories[randomZoneIndex];

          if (targetZone.owner !== randomRival) {
            targetZone.owner = randomRival;
            targetZone.color = colorMap[randomRival];
            aiEventMsg = `[AI Offensive] ${randomRival} successfully contested and captured the ${targetZone.name}!`;
          }
        } else {
          const randomAiAction = ["mobilized troops", "upgraded factories", "secured trade routes"][Math.floor(Math.random() * 3)];
          aiEventMsg = `[AI Update] Rival power blocs have ${randomAiAction}.`;
        }

        setTerritories(updatedTerritories);
        setMonth(nextMonth);
        setYear(nextYear);
        setStats({
          ip: Math.max(0, newIp),
          mp: Math.max(0, newMp),
          energy: Math.max(0, newEnergy),
          stability: Math.min(100, Math.max(0, newStab)),
          warSupport: Math.min(100, Math.max(0, newWarSup)),
        });

        setLogs(prev => [
          `[Month ${nextMonth}, ${nextYear}] ${logMsg}`,
          aiEventMsg,
          ...prev.slice(0, 8)
        ]);
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans p-4 sm:p-6 select-none flex flex-col items-center">
          <header className="w-full max-w-5xl bg-slate-900 border border-slate-800 rounded-xl p-4 mb-6 shadow-xl flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
              <h1 className="text-xl sm:text-2xl font-black tracking-wider uppercase text-amber-500 flex items-center gap-2">
                <i className="fa-solid fa-globe"></i> Grand Strategy: Global Crisis
              </h1>
            </div>
            {gameState === 'playing' && nation && (
              <div className="flex items-center gap-3 bg-slate-950 px-4 py-2 rounded-lg border border-slate-800 text-sm">
                <div><span className="text-slate-400">Nation:</span> <strong className="text-white">{nation.name}</strong></div>
                <div className="text-slate-600">|</div>
                <div><span className="text-slate-400">Date:</span> <strong className="text-amber-400">Month {month}, {year}</strong></div>
              </div>
            )}
          </header>

          <main className="w-full max-w-5xl">
            {gameState === 'menu' && (
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 sm:p-8 shadow-2xl text-center">
                <h2 className="text-2xl sm:text-3xl font-bold mb-3 text-white">Select Your Power Bloc</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-left mt-6">
                  {Object.keys(nationsData).map((key) => {
                    const nat = nationsData[key];
                    return (
                      <div key={key} className="bg-slate-950 border border-slate-800 hover:border-amber-500/55 transition-all rounded-xl p-5 flex flex-col justify-between shadow-md">
                        <div>
                          <h3 className="text-lg font-bold text-amber-400">{nat.name}</h3>
                          <p className="text-xs text-slate-400 mb-4">{nat.desc}</p>
                        </div>
                        <button onClick={() => selectNation(key)} className="bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition-colors shadow">
                          Lead Nation <i className="fa-solid fa-arrow-right ml-1"></i>
                        </button>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {gameState === 'playing' && nation && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="lg:col-span-2 space-y-6">
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl grid grid-cols-2 sm:grid-cols-5 gap-4 text-center">
                    <div className="bg-slate-950 p-3 rounded-lg border border-slate-800">
                      <div className="text-[10px] uppercase text-slate-400">Industry</div>
                      <div className="text-xl font-extrabold text-blue-400 mt-1">{stats.ip} <span className="text-xs text-slate-500">IP</span></div>
                    </div>
                    <div className="bg-slate-950 p-3 rounded-lg border border-slate-800">
                      <div className="text-[10px] uppercase text-slate-400">Manpower</div>
                      <div className="text-xl font-extrabold text-green-400 mt-1">{stats.mp}k</div>
                    </div>
                    <div className="bg-slate-950 p-3 rounded-lg border border-slate-800">
                      <div className="text-[10px] uppercase text-slate-400">Energy</div>
                      <div className="text-xl font-extrabold text-yellow-400 mt-1">{stats.energy}</div>
                    </div>
                    <div className="bg-slate-950 p-3 rounded-lg border border-slate-800">
                      <div className="text-[10px] uppercase text-slate-400">Stability</div>
                      <div className="text-xl font-extrabold text-indigo-400 mt-1">{stats.stability}%</div>
                    </div>
                    <div className="bg-slate-950 p-3 rounded-lg border border-slate-800 col-span-2 sm:col-span-1">
                      <div className="text-[10px] uppercase text-slate-400">War Support</div>
                      <div className="text-xl font-extrabold text-red-400 mt-1">{stats.warSupport}%</div>
                    </div>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl">
                    <h3 className="text-sm font-bold tracking-wider uppercase text-slate-300 mb-3 border-b border-slate-800 pb-2">
                      <i className="fa-solid fa-map mr-2 text-amber-500"></i> Global Territory Control
                    </h3>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                      {territories.map(zone => (
                        <div key={zone.id} className={`border p-3 rounded-lg text-center transition-all duration-300 ${zone.color}`}>
                          <div className="text-xs font-bold">{zone.name}</div>
                          <div className="text-[10px] mt-1 opacity-90 font-semibold">Owner: {zone.owner}</div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl">
                    <h3 className="text-sm font-bold tracking-wider uppercase text-slate-300 mb-4 border-b border-slate-800 pb-2">
                      <i className="fa-solid fa-chess-board mr-2 text-amber-500"></i> Strategic Executive Actions
                    </h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <button onClick={() => advanceMonth('military')} className="bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-red-500/50 p-4 rounded-xl text-left transition-all">
                        <div className="font-bold text-red-400 text-sm mb-1">Military Buildup</div>
                        <p className="text-xs text-slate-400">Cost: 15 IP, 50k Manpower.</p>
                      </button>
                      <button onClick={() => advanceMonth('economy')} className="bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-blue-500/50 p-4 rounded-xl text-left transition-all">
                        <div className="font-bold text-blue-400 text-sm mb-1">Industrial Expansion</div>
                        <p className="text-xs text-slate-400">Focuses capacity on building factories (+10 IP).</p>
                      </button>
                      <button onClick={() => advanceMonth('diplomacy')} className="bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-indigo-500/50 p-4 rounded-xl text-left transition-all">
                        <div className="font-bold text-indigo-400 text-sm mb-1">Diplomatic Maneuvers</div>
                        <p className="text-xs text-slate-400">Secure resource pacts (+5 Stability).</p>
                      </button>
                      <button onClick={() => advanceMonth('pass')} className="bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/50 p-4 rounded-xl text-left transition-all">
                        <div className="font-bold text-amber-400 text-sm mb-1">Strategic Patience</div>
                        <p className="text-xs text-slate-400">Hold current positions.</p>
                      </button>
                    </div>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl flex flex-col h-[400px] lg:h-auto">
                  <h3 className="text-sm font-bold tracking-wider uppercase text-slate-300 mb-3 border-b border-slate-800 pb-2">
                    <i className="fa-solid fa-terminal mr-2 text-amber-500"></i> Situation Log
                  </h3>
                  <div className="bg-slate-950 border border-slate-800 rounded-lg p-3 flex-1 overflow-y-auto space-y-2 text-xs font-mono">
                    {logs.map((log, index) => (
                      <div key={index} className="text-slate-300 border-b border-slate-900 pb-1.5 last:border-0">
                        {log}
                      </div>
                    ))}
                  </div>
                  <div className="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center">
                    <span className="text-[10px] text-slate-500 uppercase tracking-widest">DEFCON 2</span>
                    <button onClick={() => setGameState('menu')} className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg">
                      Main Menu
                    </button>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
